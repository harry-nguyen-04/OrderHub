services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-hub
    env_file:
      - .env
    ports:
      - "${SERVER_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: order-hub-db
    env_file:
      - .env
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: order-hub-redis
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: order-hub-seaweedfs
    restart: unless-stopped

    environment:
      SEAWEEDFS_S3_ACCESS_KEY: ${SEAWEEDFS_S3_ACCESS_KEY}
      SEAWEEDFS_S3_SECRET_KEY: ${SEAWEEDFS_S3_SECRET_KEY}

    entrypoint: [ "/bin/sh", "-c" ]

    command:
      - |
        set -eu
        
        mkdir -p /etc/seaweedfs
        
        cat > /etc/seaweedfs/s3.json <<EOF
        {
          "identities": [
            {
              "name": "orderhub",
              "credentials": [
                {
                  "accessKey": "$$SEAWEEDFS_S3_ACCESS_KEY",
                  "secretKey": "$$SEAWEEDFS_S3_SECRET_KEY"
                }
              ],
              "actions": ["Admin", "Read", "Write", "List"]
            }
          ]
        }
        EOF
        
        exec weed server \
          -dir=/data \
          -s3 \
          -s3.port=8333 \
          -s3.config=/etc/seaweedfs/s3.json

    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"

    volumes:
      - seaweedfs_data:/data

volumes:
  postgres_data:
  seaweedfs_data:

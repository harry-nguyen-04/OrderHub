server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: OrderHub
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

logging:
  structured:
    format:
      console: logstash

app:
  payment:
    provider-base-url: ${PAYMENT_PROVIDER_BASE_URL:http://localhost:8081}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET}
    connect-timeout: 300ms
    read-timeout: 500ms
    time-limit: 3s
    max-attempts: 3
    retry-initial-backoff: 100ms
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${ACCESS_TOKEN_EXPIRATION}
    refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
